version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Node's types track the runtime (Node 22: .nvmrc and CI), not the newest Node.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
